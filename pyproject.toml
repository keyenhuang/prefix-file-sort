[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prefix-file-sort"
version = "1.1.0"
description = "A smart file grouping tool that organizes files into folders based on their filename prefixes."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Keyen Huang" }]
keywords = [
    "file-organization",
    "file-sort",
    "file-grouping",
    "prefix",
    "tkinter",
    "organize",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
]

dependencies = [
    "customtkinter>=6.0.0",
]

[project.scripts]
prefix-file-sort = "prefix_file_sort.main:main"

[project.optional-dependencies]
dnd = ["tkinterdnd2>=0.3.0"]
dev = ["ruff>=0.4.0", "pyinstaller>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py38"
extend-exclude = ["dist", "build", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401"]
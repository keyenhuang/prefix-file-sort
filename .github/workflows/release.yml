name: Release

# Build a portable Windows executable whenever a version tag (v*) is pushed,
# and attach it to a GitHub Release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller customtkinter tkinterdnd2

      - name: Build executable with PyInstaller
        run: pyinstaller prefix_file_sort.spec --clean --noconfirm

      - name: Verify executable exists
        run: |
          if (-Not (Test-Path "dist/prefix-file-sort/prefix-file-sort.exe")) {
            Write-Error "Executable not found at dist/prefix-file-sort/prefix-file-sort.exe"
            exit 1
          }

      - name: Zip portable distribution
        shell: pwsh
        run: Compress-Archive -Path dist/prefix-file-sort -DestinationPath prefix-file-sort-windows.zip

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: prefix-file-sort-windows.zip
          generate_release_notes: true
